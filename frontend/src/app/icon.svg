<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>InfraSentinel</title>
  <style>
    .spark { stroke-dasharray: 12 88; animation: spark 2.4s cubic-bezier(0.55, 0.1, 0.35, 0.95) infinite; }
    @keyframes spark { from { stroke-dashoffset: 12; } to { stroke-dashoffset: -100; } }
    @media (prefers-reduced-motion: reduce) { .spark { animation: none; opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="8" y1="8" x2="56" y2="56">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.55" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff3cac"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111737"/>
      <stop offset="1" stop-color="#070915"/>
    </linearGradient>
  </defs>
  <path d="M32 5.5 L54.5 18.5 V45.5 L32 58.5 L9.5 45.5 V18.5 Z" fill="url(#fill)" stroke="url(#neon)" stroke-width="4" stroke-linejoin="round"/>
  <path d="M9.5 33 H20.5 L24.5 26 L29.5 41.5 L35.5 17.5 L40.5 33 H54.5" fill="none" stroke="url(#neon)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="spark" d="M9.5 33 H20.5 L24.5 26 L29.5 41.5 L35.5 17.5 L40.5 33 H54.5" pathLength="100" fill="none" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="35.5" cy="17.5" r="3.6" fill="#ffffff" stroke="#ff3cac" stroke-width="1.8"/>
</svg>
